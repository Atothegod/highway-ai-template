<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf3f7">
  <title>เลือกทางเข้า | BEM Care</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #0a3458;
      --muted: #4c6274;
      --line: #cfdce5;
      --gold: #b49856;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      color: var(--navy);
      background: radial-gradient(ellipse at 50% 0%, #fff 0%, #edf3f7 65%);
      font: 1rem/1.6 system-ui, "Noto Sans Thai", sans-serif;
    }

    .shell {
      width: min(100% - clamp(32px, 8vw, 96px), 960px);
      margin-inline: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: clamp(12px, 3vw, 20px);
      padding-block: clamp(18px, 4vw, 32px);
      border-bottom: 1px solid var(--line);
      font-weight: 750;
    }

    .brand img {
      display: block;
      width: clamp(78px, 15vw, 110px);
      height: auto;
      aspect-ratio: 104 / 38;
      object-fit: contain;
    }

    .brand span {
      padding-inline-start: clamp(12px, 3vw, 20px);
      border-inline-start: 1px solid var(--line);
      white-space: nowrap;
    }

    main { padding-block: clamp(42px, 9vh, 104px) 48px; }

    h1 {
      max-width: 100%;
      margin: 0 0 clamp(22px, 4vw, 36px);
      font-size: clamp(1.85rem, 5vw, 3.25rem);
      line-height: 1.24;
      letter-spacing: -.025em;
    }

    h1::before {
      display: block;
      width: 36px;
      height: 3px;
      margin-bottom: 18px;
      border-radius: 2px;
      background: var(--gold);
      content: "";
    }

    nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 2vw, 20px); }

    .entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 156px;
      padding: clamp(18px, 3.5vw, 30px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 8px 22px #0a34580d;
      color: inherit;
      text-decoration: none;
      transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    .entry.primary {
      border-color: #103b62;
      background: linear-gradient(135deg, #103e66, #092b49);
      color: #fff;
    }

    .entry strong {
      display: block;
      margin-bottom: 5px;
      font-size: clamp(1.12rem, 2.3vw, 1.45rem);
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .entry .description {
      display: block;
      color: var(--muted);
      font-size: clamp(.9rem, 1.8vw, 1rem);
      line-height: 1.6;
    }

    .entry.primary .description { color: #e5eff7; }

    .arrow {
      display: grid;
      width: clamp(32px, 5vw, 42px);
      aspect-ratio: 1;
      place-items: center;
      border-radius: 50%;
      background: #e9f1f7;
      font-size: 1.2rem;
      line-height: 1;
    }

    .primary .arrow { background: #ffffff23; }
    .entry:focus-visible { outline: 3px solid #08778b; outline-offset: 4px; }

    @media (hover: hover) {
      .entry:hover { border-color: #7ba2bc; box-shadow: 0 10px 24px #0a345822; }
      .entry:hover strong { text-decoration: underline; text-underline-offset: 4px; }
    }

    @media (max-width: 620px) {
      nav { grid-template-columns: 1fr; }
      .entry { min-height: 108px; border-radius: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .entry { transition: none; }
    }
  </style>
</head>
<body>
  <header class="shell brand">
    <img src="https://www.bemplc.co.th/Images/logos/logo-bem.svg" alt="BEM" width="104" height="38">
    <span>BEM Care</span>
  </header>
  <main class="shell">
    <h1>เลือกทางเข้าระบบ</h1>
    <nav aria-label="ทางเข้าตามบทบาท">
      <a class="entry primary" href="{% url 'chat_login' %}">
        <span>
          <strong>ผู้แจ้งเหตุ</strong>
          <span class="description">แจ้งปัญหาหรือติดตามเรื่องผ่านแชต</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="entry" href="{% url 'operations_login' %}">
        <span>
          <strong>เจ้าหน้าที่ Operations</strong>
          <span class="description">ดูรายการเคส แผนที่ และติดตามการดำเนินงาน</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </main>
</body>
</html>
