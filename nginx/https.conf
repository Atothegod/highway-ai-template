server {
    listen 80;
    server_name bem-ai.dataforthai.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 308 https://bem-ai.dataforthai.org$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bem-ai.dataforthai.org;

    error_page 497 =308 https://bem-ai.dataforthai.org$request_uri;

    ssl_certificate /etc/letsencrypt/live/bem-ai.dataforthai.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bem-ai.dataforthai.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/proxy.inc;
}
