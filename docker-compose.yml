services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_template}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent_template}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DJANGO_HTTPS_DOMAIN: bem-ai.dataforthai.org
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  nginx:
    image: nginx:stable-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/bootstrap.conf:ro
      - ./nginx/https.conf:/etc/nginx/https.conf:ro
      - ./nginx/proxy.inc:/etc/nginx/proxy.inc:ro
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command:
      - /bin/sh
      - -ec
      - |
        if [ -s /etc/letsencrypt/live/bem-ai.dataforthai.org/fullchain.pem ] &&
           [ -s /etc/letsencrypt/live/bem-ai.dataforthai.org/privkey.pem ]; then
          cp /etc/nginx/https.conf /etc/nginx/conf.d/default.conf
        else
          cp /etc/nginx/bootstrap.conf /etc/nginx/conf.d/default.conf
        fi
        exec nginx -g 'daemon off;'
    depends_on:
      - backend

volumes:
  postgres_data:
